import java.nio.file.Paths
import com.android.build.api.artifact.SingleArtifact

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.rikka.refine)
    alias(libs.plugins.rikka.autoresconfig)
    alias(libs.plugins.rikka.materialthemebuilder)
}

android {
    namespace 'moe.shizuku.manager'
    defaultConfig {
        applicationId "moe.shizuku.privileged.api"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        prefab true
    }
    signingConfigs {
        sign
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sign
        }
        release {
            signingConfig signingConfigs.sign
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            proguardFiles 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.31.0+"
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['**']
        }
    }
    dependenciesInfo {
        includeInApk false
    }
    lint {
        checkReleaseBuilds false
    }
}

autoResConfig {
    generatedClassFullName = "rikka.shizuku.manager.ShizukuLocales"
    generateRes = false
    generatedArrayFirstItem = "SYSTEM"
    generateLocaleConfig = true
}

materialThemeBuilder {
    themes {
        shizuku {
            primaryColor = "#3F51B5"
            lightThemeFormat = "Theme.Material3.Light.%s"
            lightThemeParent = "Theme.Material3.Light.Rikka"
            darkThemeFormat = "Theme.Material3.Dark.%s"
            darkThemeParent = "Theme.Material3.Dark.Rikka"
        }
    }
    generatePalette = true
    generateTextColors = true
}

def collapseReleaseResourceNames = tasks.register('collapseReleaseResourceNames') {
    doLast {
        def aapt2 = Paths.get(project.android.sdkDirectory.path, 'build-tools', project.android.buildToolsVersion, 'aapt2')
        def zip = Paths.get(project.layout.buildDirectory.get().asFile.path, 'intermediates',
                'optimized_processed_res', 'release', 'optimizeReleaseResources', 'resources-release-optimize.ap_')
        def optimized = new File("${zip}.opt")
        def cmd = exec {
            commandLine aapt2, 'optimize', '--collapse-resource-names',
                    '--resources-config-path', 'aapt2-resources.cfg',
                    '-o', optimized, zip
            ignoreExitValue false
        }
        if (cmd.exitValue == 0) {
            delete(zip)
            optimized.renameTo("$zip")
        }
    }
}

afterEvaluate {
    tasks.getByName('optimizeReleaseResources').finalizedBy(collapseReleaseResourceNames)
    tasks.getByName('preReleaseBuild').dependsOn(':shell:extractRishReleaseDex')
    tasks.getByName('preDebugBuild').dependsOn(':shell:extractRishDebugDex')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def capName = variantName.substring(0, 1).toUpperCase() + variantName.substring(1)

        if (variantName == "release") {
            def apkDir = variant.artifacts.get(SingleArtifact.APK)
            def mappingFile = variant.artifacts.get(SingleArtifact.OBFUSCATION_MAPPING_FILE)
            def outDir = new File(rootDir, "out")
            def apkOutDir = new File(outDir, "apk")
            def mappingOutDir = new File(outDir, "mapping")
            def versionNameProvider = variant.outputs.first().versionName

            def copyArtifacts = tasks.register("copyShizuku${capName}Artifacts") {
                inputs.dir(apkDir)
                inputs.file(mappingFile)
                doLast {
                    def apkFile = apkDir.get().asFile.listFiles().find { it.name.endsWith(".apk") }
                    copy {
                        from apkFile
                        into apkOutDir
                        rename { "shizuku-v${versionNameProvider.get()}-${variantName}.apk" }
                    }
                    copy {
                        from mappingFile.get().asFile
                        into mappingOutDir
                        rename { "mapping-${versionNameProvider.get()}.txt" }
                    }
                }
            }
            tasks.named("assemble${capName}").configure { finalizedBy(copyArtifacts) }
        }
    }
}

